# Builds the release assets on native runners and attaches them to a GitHub Release, after
# Aurelia's release workflow (https://github.com/Drackrath/Aurelia):
#   launchme-<version>-win64-setup.exe   Windows installer (installer/launchme.iss)
#   launchme-<version>-win64.zip         Windows without installer, the Windows updater's package (launchme/...)
#   launchme-<version>-x86_64.AppImage   Linux (tools/linux/make-appimage.sh), the Linux updater's package
#   SHA256SUMS (+ .sigstore.json)        every asset's SHA-256, signed keylessly with Sigstore cosign
#
# A pushed v<version> tag builds and publishes (the tag must match project() in CMakeLists.txt);
# workflow_dispatch only builds and keeps the files as workflow artifacts.
# The release notes are changelog/<version>.md when it exists, else GitHub's generated notes.

name: Release

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    tags:
      - "v[0-9]*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Windows installer and ZIP
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7

      - name: Version
        id: version
        shell: bash
        run: |
          version=$(sed -n 's/^project(launchme VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match project() version $version"; exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # The newest Visual Studio on the runner (tools/build.ps1 pins VS 2026 for local builds).
      - name: Build launchme (Release)
        shell: pwsh
        run: |
          cmake -S . -B build/temp/ci -A x64 -DLAUNCHME_STATIC_RUNTIME=ON -DBUILD_TESTING=OFF
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build build/temp/ci --config Release --target launchme --parallel
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --install build/temp/ci --config Release --component Runtime --prefix build/vs

      - name: Install Inno Setup
        run: choco upgrade innosetup -y --no-progress

      - name: Build the installer
        shell: pwsh
        run: ./tools/build-installer.ps1 -SkipBuild

      # The same files under one launchme/ folder with forward slashes, as src/platform/updater.cpp
      # unpacks it (cmake -E tar, like the plugin packages; Compress-Archive can write backslashes).
      - name: Build the ZIP
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          New-Item -ItemType Directory -Force build/zip | Out-Null
          Copy-Item -Recurse build/vs build/zip/launchme
          Push-Location build/zip
          cmake -E tar cf "../installer/launchme-$env:VERSION-win64.zip" --format=zip launchme
          $code = $LASTEXITCODE
          Pop-Location
          if ($code) { exit $code }

      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: |
            build/installer/launchme-${{ steps.version.outputs.version }}-win64-setup.exe
            build/installer/launchme-${{ steps.version.outputs.version }}-win64.zip

      - name: Publish to the release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: bash tools/release-upload.sh "build/installer/launchme-$VERSION-win64-setup.exe" "build/installer/launchme-$VERSION-win64.zip"

  linux:
    name: Linux AppImage
    runs-on: ubuntu-24.04
    env:
      CC: gcc-14
      CXX: g++-14
      SDL3_TAG: release-3.4.18
      LINUXDEPLOY: https://github.com/linuxdeploy/linuxdeploy/releases/download/1-alpha-20251107-1/linuxdeploy-x86_64.AppImage
      LINUXDEPLOY_SHA256: c20cd71e3a4e3b80c3483cef793cda3f4e990aca14014d23c544ca3ce1270b4d
      LINUXDEPLOY_APPIMAGE: https://github.com/linuxdeploy/linuxdeploy-plugin-appimage/releases/download/1-alpha-20250213-1/linuxdeploy-plugin-appimage-x86_64.AppImage
      LINUXDEPLOY_APPIMAGE_SHA256: 992d502a248e14ab185448ddf6f6e7d25558cb84d4623c354c3af350c25fccb3
    steps:
      - uses: actions/checkout@v7

      - name: Version
        id: version
        run: |
          version=$(sed -n 's/^project(launchme VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match project() version $version"; exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # docs/linux-port.md's packages, by their Ubuntu names; GTK 4 + WebKitGTK for the browser helper,
      # the X11/Wayland/audio headers for SDL3, ImageMagick for the AppImage's icon.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-14 g++-14 clang cmake ninja-build pkg-config git python3 nasm file imagemagick \
            libicu-dev libssl-dev libsecret-1-dev libcurl4-openssl-dev libpng-dev libwebp-dev libexpat1-dev \
            libsqlite3-dev libglib2.0-dev libarchive-dev libsystemd-dev libpulse-dev \
            libavformat-dev libavcodec-dev libavutil-dev libswresample-dev libswscale-dev \
            libfontconfig-dev libfreetype-dev libharfbuzz-dev libgl-dev libegl-dev \
            libgtk-4-dev libwebkitgtk-6.0-dev libsoup-3.0-dev libx11-dev \
            libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxss-dev libxfixes-dev libxtst-dev libxkbcommon-dev \
            libwayland-dev wayland-protocols libdecor-0-dev libdrm-dev libgbm-dev libgles-dev \
            libasound2-dev libpipewire-0.3-dev libudev-dev libdbus-1-dev libusb-1.0-0-dev

      # Skia takes the longest; it is rebuilt only when tools/linux/build-skia.sh changes. ~/skia is
      # where build-skia.sh puts it and where CMake (LAUNCHME_SKIA_DIR) looks by default. Restore and
      # save are separate steps so a build is kept even when a later step fails.
      - name: Restore Skia
        id: skia
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/skia
            !~/skia/.git
            !~/skia/out/Release/obj
          key: skia-${{ runner.os }}-${{ hashFiles('tools/linux/build-skia.sh') }}

      - name: Build Skia
        if: steps.skia.outputs.cache-hit != 'true'
        run: bash tools/linux/build-skia.sh

      - name: Save Skia
        if: steps.skia.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/skia
            !~/skia/.git
            !~/skia/out/Release/obj
          key: ${{ steps.skia.outputs.cache-primary-key }}

      # SDL3 is not packaged in Ubuntu 24.04: the version tools/linux/wsl-build-sdl3.sh builds, with
      # the X11, Wayland and audio back ends of SDL's README-linux.
      - name: Restore SDL3
        id: sdl3
        uses: actions/cache/restore@v6
        with:
          path: ~/sdl3
          key: sdl3-${{ runner.os }}-${{ env.SDL3_TAG }}

      - name: Build SDL3
        if: steps.sdl3.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "$SDL3_TAG" https://github.com/libsdl-org/SDL.git "$RUNNER_TEMP/SDL"
          cmake -S "$RUNNER_TEMP/SDL" -B "$RUNNER_TEMP/SDL/build" -G Ninja -DCMAKE_BUILD_TYPE=Release \
            "-DCMAKE_INSTALL_PREFIX=$HOME/sdl3" -DSDL_SHARED=ON -DSDL_STATIC=OFF -DSDL_TESTS=OFF -DSDL_EXAMPLES=OFF
          cmake --build "$RUNNER_TEMP/SDL/build"
          cmake --install "$RUNNER_TEMP/SDL/build"

      - name: Save SDL3
        if: steps.sdl3.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/sdl3
          key: ${{ steps.sdl3.outputs.cache-primary-key }}

      - name: Build launchme (Release)
        run: |
          cmake -S . -B build/linux -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF \
            "-DLAUNCHME_SKIA_DIR=$HOME/skia" "-DCMAKE_PREFIX_PATH=$HOME/sdl3"
          cmake --build build/linux --target launchme

      - name: Fetch linuxdeploy
        run: |
          mkdir -p "$RUNNER_TEMP/appimage-tools"
          cd "$RUNNER_TEMP/appimage-tools"
          curl -fsSL -o linuxdeploy-x86_64.AppImage "$LINUXDEPLOY"
          curl -fsSL -o linuxdeploy-plugin-appimage-x86_64.AppImage "$LINUXDEPLOY_APPIMAGE"
          echo "$LINUXDEPLOY_SHA256  linuxdeploy-x86_64.AppImage" | sha256sum -c -
          echo "$LINUXDEPLOY_APPIMAGE_SHA256  linuxdeploy-plugin-appimage-x86_64.AppImage" | sha256sum -c -
          chmod +x *.AppImage

      - name: Build the AppImage
        run: |
          LD_LIBRARY_PATH="$HOME/sdl3/lib" LM_SRC="$GITHUB_WORKSPACE" LM_APPIMAGE_TOOLS="$RUNNER_TEMP/appimage-tools" \
            bash tools/linux/make-appimage.sh "$GITHUB_WORKSPACE/build/linux" "$GITHUB_WORKSPACE/out"

      - uses: actions/upload-artifact@v7
        with:
          name: linux-appimage
          path: out/launchme-${{ steps.version.outputs.version }}-x86_64.AppImage

      - name: Publish to the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: bash tools/release-upload.sh "out/launchme-$VERSION-x86_64.AppImage"

  checksums:
    name: Release checksums
    if: startsWith(github.ref, 'refs/tags/')
    needs: [windows, linux]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write # Sigstore's keyless signing (the workflow's OIDC identity).
    steps:
      - name: Download the release's assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release-assets
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --dir release-assets

      - name: Generate SHA256SUMS
        run: |
          rm -f release-assets/SHA256SUMS release-assets/SHA256SUMS.sig release-assets/SHA256SUMS.pem release-assets/SHA256SUMS.sigstore.json
          (cd release-assets && find . -maxdepth 1 -type f -printf '%f\n' | sort | xargs -d '\n' sha256sum --) > SHA256SUMS
          test -s SHA256SUMS
          cat SHA256SUMS

      # cosign-installer publishes no moving major tag (v4): a full version. Its cosign 3 signs into
      # one Sigstore bundle (signature, certificate, transparency-log proof); with its default signing
      # config the old --output-signature/--output-certificate files are never written.
      - uses: sigstore/cosign-installer@v4.1.2

      - name: Sign SHA256SUMS
        run: |
          cosign sign-blob SHA256SUMS --yes --bundle SHA256SUMS.sigstore.json
          test -s SHA256SUMS.sigstore.json
          cosign verify-blob SHA256SUMS --bundle SHA256SUMS.sigstore.json \
            --certificate-identity "https://github.com/$GITHUB_REPOSITORY/.github/workflows/release.yml@$GITHUB_REF" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com

      - name: Publish checksums and signature
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" SHA256SUMS SHA256SUMS.sigstore.json --repo "$GITHUB_REPOSITORY" --clobber
